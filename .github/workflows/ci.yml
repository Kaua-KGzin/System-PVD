name: CI

on:
  push:
    # Branches de trabalho tambem rodam. Sem isso um branch so e compilado quando
    # vira PR, entao commits empurrados depois do PR aberto — ou antes dele — chegam
    # a uma decisao de merge sem nunca terem passado por build nem teste.
    branches: [main, dev, 'claude/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  # Permite rodar sob demanda em qualquer branch, pela aba Actions.
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ARCHlab.slnx

      - name: Build
        run: dotnet build ARCHlab.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Archlab.Backend.Tests/Archlab.Backend.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Archlab.Backend.Tests/TestResults/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t archlab-backend:${{ github.sha }} ./Archlab.Backend

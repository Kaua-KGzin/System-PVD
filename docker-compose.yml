services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdv
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv -d pdv"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Pdv.Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: PostgreSQL
      ConnectionStrings__PdvDatabase: "Host=db;Database=pdv;Username=pdv;Password=${POSTGRES_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Jwt__Issuer: pdv-api
      Jwt__Audience: pdv-client
      Jwt__ExpirationHours: "8"
      SeedAdmin__Username: ${SEED_ADMIN_USERNAME:?SEED_ADMIN_USERNAME is required}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SeedAdmin__Role: Admin
    ports:
      - "8080:8080"

volumes:
  pgdata:

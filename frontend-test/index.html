<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="setup-screen" class="screen active">
        <div class="glass-panel form-panel">
            <h2>Abrir Caixa</h2>
            <div class="form-group">
                <label>Operador</label>
                <input type="text" id="operatorName" value="Maria">
            </div>
            <div class="form-group">
                <label>Troco Inicial (R$)</label>
                <input type="number" id="openingAmount" value="150.00" step="0.01">
            </div>
            <button id="btnOpenRegister" class="btn-primary">Abrir Sessão de Caixa</button>
        </div>
    </div>

    <div id="pdv-screen" class="screen">
        <header class="navbar">
            <div class="logo">PDV <span style="color:var(--text-primary)">SIMULATOR</span></div>
            <div class="status">
                <span class="operator-badge">👤 Operador: <span id="lblOperator"></span></span>
                <span class="status-badge success">Caixa Aberto</span>
            </div>
        </header>

        <main class="grid-container">
            <section class="left-panel glass-panel">
                <div class="scanner-section">
                    <input type="text" id="barcodeInput" placeholder="Escaneie o código de barras (Ex: 7891000100103)..." autocomplete="off">
                    <button id="btnScan" class="btn-primary">Adicionar</button>
                </div>
                
                <div class="quick-add-section">
                    <h4>Testes Rápidos:</h4>
                    <div class="quick-add-buttons">
                        <button class="btn-quick-add" data-barcode="7891000100103">🍚 Arroz 5kg</button>
                        <button class="btn-quick-add" data-barcode="7894900011517">🥤 Cola 2L</button>
                        <button class="btn-quick-add" data-barcode="7891910000197">☕ Café 500g</button>
                    </div>
                </div>
                
                <div class="cart-section">
                    <div class="cart-header">
                        <span>Produto / Código</span>
                        <span>Qtd</span>
                        <span>Preço Unit.</span>
                        <span style="text-align: right">Total</span>
                    </div>
                    <ul id="cartItems" class="cart-items">
                        <!-- Itens renderizados no JS -->
                    </ul>
                </div>
            </section>

            <section class="right-panel glass-panel">
                <div class="totals">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="lblSubtotal">R$ 0,00</span>
                    </div>
                    <div class="total-row grand-total">
                        <span>Total Venda</span>
                        <span id="lblTotal">R$ 0,00</span>
                    </div>
                </div>

                <div class="payment-section hidden" id="paymentSection">
                    <h3>Forma de Pagamento</h3>
                    <div class="payment-methods">
                        <button class="pay-method active" data-method="Cash">💵 Dinheiro</button>
                        <button class="pay-method" data-method="CreditCard">💳 Crédito</button>
                        <button class="pay-method" data-method="DebitCard">💳 Débito</button>
                        <button class="pay-method" data-method="Pix">📱 PIX</button>
                    </div>
                    <button id="btnFinalize" class="btn-success btn-large">Finalizar Venda</button>
                </div>

                <div id="checkoutAction">
                    <button id="btnCheckout" class="btn-primary btn-large">Ir para Pagamento</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

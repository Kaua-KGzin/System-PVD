services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archlab
      POSTGRES_PASSWORD: archlab_prod_password
      POSTGRES_DB: archlab
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=archlab;Username=archlab;Password=archlab_prod_password
      - Jwt__SecretKey=SuperSecretKey_For_Production_Demo_Must_Be_32_Bytes_Long_At_Least
      - Jwt__Issuer=Archlab
      - Jwt__Audience=Archlab
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_prod:
